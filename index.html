<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Spacetime Forge" />
<meta name="theme-color" content="#f4f6f9" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/thema.css" />
<title>Spacetime Forge</title>
</head>
<body>

<div id="app">
  <nav id="nav">
    <div class="merk">
      <h1>Spacetime <span>Forge</span></h1>
      <p>Speciale relativiteit, visueel</p>
    </div>
    <div id="nav-lijst"></div>
    <div id="versie"></div>
  </nav>
  <main id="inhoud">
    <header>
      <div class="kop-tekst">
        <h2 id="titel">Laden…</h2>
        <p id="onderschrift"></p>
      </div>
      <div class="kop-knoppen">
        <button class="knop" id="begin-knop">Beginstand</button>
        <button class="knop" id="deel-knop">Deel link</button>
        <button class="knop" id="uitleg-knop">Uitlegmodus</button>
      </div>
      <div id="deel-veld" hidden>
        <label for="deel-adres">Kopieer deze link:</label>
        <input id="deel-adres" type="text" readonly />
        <button class="knop" id="deel-dicht">Klaar</button>
      </div>
    </header>
    <div id="module"></div>
  </main>
</div>

<script type="module">
import { registreer, moduleLijst } from './js/register.js';
import { maakTabbladen } from './js/tabbladen.js';
import { startUitlegmodus } from './js/uitlegmodus.js';
import { VERSIE, DATUM } from './js/versie.js';
import { leesStand, verschil, zetStand, naarHash, uitHash, haalOp, bewaar } from './js/geheugen.js';

// --- Modules aanmelden ---------------------------------------------------
// Elke module is een los bestand dat een render(doel) exporteert.
// Modules die er nog niet zijn, staan als 'komt nog' in het menu.
const GROEPEN = [
  {
    titel: 'Fundament',
    items: [
      { id: 'welkom', naam: 'Welkom', pad: './js/modules/welkom.js' },
    ],
  },
  {
    titel: 'Ruimtetijd',
    items: [
      { id: 'minkowski-pro', naam: 'Minkowski-diagram Pro', pad: './js/modules/minkowski-pro.js' },
      { id: 'lichtklok',     naam: 'Lichtklok-afleiding',   pad: './js/modules/lichtklok.js' },
      { id: 'gelijktijdig',  naam: 'Gelijktijdigheid',      pad: './js/modules/gelijktijdigheid.js' },
      { id: 'minkowski',     naam: 'Minkowski-diagram',     pad: './js/modules/minkowski.js' },
      { id: 'lichtkegel',    naam: 'Lichtkegel',            pad: './js/modules/lichtkegel.js' },
    ],
  },
  {
    titel: 'Verdieping',
    items: [
      { id: 'tweeling', naam: 'Tweelingparadox', pad: './js/modules/tweeling.js' },
      { id: 'loods',    naam: 'Staaf in de loods', pad: './js/modules/loods.js' },
      { id: 'kever',    naam: 'Kever en klinknagel', pad: './js/modules/kever.js' },
      { id: 'optellen', naam: 'Snelheden optellen', pad: './js/modules/optellen.js' },
      { id: 'epstein',  naam: 'Epstein-cirkel',  pad: './js/modules/epstein.js' },
    ],
  },
];

for (const groep of GROEPEN) {
  for (const item of groep.items) registreer(item);
}

// --- Navigatie opbouwen --------------------------------------------------
const navLijst = document.getElementById('nav-lijst');
const knoppen = new Map();

for (const groep of GROEPEN) {
  const g = document.createElement('div');
  g.className = 'groep';
  const t = document.createElement('div');
  t.className = 'groep-titel';
  t.textContent = groep.titel;
  g.appendChild(t);

  for (const item of groep.items) {
    const knop = document.createElement('button');
    knop.textContent = item.naam;
    knop.disabled = !item.pad;
    if (item.pad) knop.addEventListener('click', () => ga(item.id, { nieuw: true }));
    g.appendChild(knop);
    knoppen.set(item.id, knop);
  }
  navLijst.appendChild(g);
}

// --- Module laden --------------------------------------------------------
const doel = document.getElementById('module');
const titelEl = document.getElementById('titel');
const onderEl = document.getElementById('onderschrift');

// De app onthoudt waar je was: de laatste module, het gekozen tabblad en per
// module de stand van knoppen en schuiven (zie js/geheugen.js). Dezelfde stand
// staat ook in het adres, zodat een link precies dit beeld opent.
const geheugen = haalOp();

// De zijkolom is verdeeld in tabbladen. Het tabblad dat je kiest blijft staan
// als je naar een andere module gaat, voor zover die module het ook heeft.
let tabVoorkeur = geheugen.tab || 'Bediening';

// De module die nu in beeld staat: haar id, haar verhaal voor de uitlegmodus,
// haar naam, en de stand waarin ze geladen werd (om het verschil mee te meten).
let huidige = null;
let sluitUitleg = null;
let beurt = 0;

const bestaat = (id) => moduleLijst().some((m) => m.id === id && m.pad);

/** Zet het adres, zonder dat de pagina daarop reageert. */
function zetAdres(hash, nieuw) {
  if (location.hash === '#' + hash) return;
  try {
    history[nieuw ? 'pushState' : 'replaceState'](null, '', '#' + hash);
  } catch (fout) {
    // Een browser mag dit weigeren als het te vaak gebeurt; de stand staat dan
    // nog wel in het geheugen, en het adres volgt bij de volgende wijziging.
  }
}

/** Legt de stand van dit moment vast, in de opslag en in het adres. */
function onthoud(metAdres = true) {
  if (!huidige) return;
  const stand = verschil(huidige.begin, leesStand(doel));
  if (Object.keys(stand).length) geheugen.standen[huidige.id] = stand;
  else delete geheugen.standen[huidige.id];
  geheugen.module = huidige.id;
  geheugen.tab = tabVoorkeur;
  bewaar(geheugen);
  if (metAdres) zetAdres(naarHash(huidige.id, stand), false);
}

// Niet bij elke beweging van een schuif schrijven, maar kort erna
let wacht = null;
function onthoudStraks() {
  clearTimeout(wacht);
  wacht = setTimeout(onthoud, 400);
}
for (const soort of ['input', 'click', 'touchend', 'mouseup']) {
  doel.addEventListener(soort, onthoudStraks);
}
// En in elk geval als de app naar de achtergrond gaat of gesloten wordt
window.addEventListener('pagehide', () => onthoud());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') onthoud();
});

/**
 * Laadt een module.
 *   stand    de stand die erop moet ({} is de beginstand); zonder: wat er de
 *            vorige keer bewaard is
 *   nieuw    true = een nieuwe stap in de geschiedenis (keuze in het menu)
 *   vers     true = de module die weggaat niet meer vastleggen (Beginstand)
 *   uitAdres true = het adres is al veranderd; dat van de vorige module
 *            mag dan niet meer overschreven worden
 */
async function ga(id, { stand = null, nieuw = false, vers = false, uitAdres = false } = {}) {
  const item = moduleLijst().find((m) => m.id === id);
  if (!item || !item.pad) return;
  const mijnBeurt = ++beurt;

  clearTimeout(wacht);
  if (!vers) onthoud(!uitAdres);

  for (const [k, knop] of knoppen) knop.classList.toggle('actief', k === id);

  // Staat de uitlegmodus nog aan (terugknop van de browser), dan eerst netjes
  // sluiten: anders blijft het menu verborgen.
  if (sluitUitleg) sluitUitleg();
  deelVeld.hidden = true;
  doel.innerHTML = '';
  huidige = null;
  titelEl.textContent = item.naam;
  onderEl.textContent = '';

  try {
    const mod = await import(item.pad);
    // Intussen kan er al een andere module gekozen zijn
    if (mijnBeurt !== beurt) return;
    if (mod.titel) titelEl.textContent = mod.titel;
    if (mod.onderschrift) onderEl.textContent = mod.onderschrift;
    mod.render(doel);
    maakTabbladen(doel, tabVoorkeur, (naam) => { tabVoorkeur = naam; });
    const begin = leesStand(doel);
    const terug = stand || geheugen.standen[id];
    if (terug && Object.keys(terug).length) zetStand(doel, terug);
    huidige = { id, verhaal: mod.verhaal, naam: item.naam, begin };
    // Wat er werkelijk staat is leidend: een link kan iets vragen wat niet
    // (meer) bestaat, en dat hoort dan ook niet in het adres te blijven.
    const nu = verschil(begin, leesStand(doel));
    zetAdres(naarHash(id, nu), nieuw);
    onthoud(false);
  } catch (fout) {
    doel.innerHTML =
      '<div class="paneel fout" style="border-color:#e0b4b0;background:#fdf2f1">' +
      '<h3 style="color:#b3261e">Module kon niet laden</h3>' +
      '<div style="font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap">' +
      String(fout && fout.message ? fout.message : fout) + '</div></div>';
    console.error(fout);
  }
}

// Het adres verandert van buitenaf: terug of vooruit in de browser, of een
// link die in dit tabblad geplakt wordt. Onze eigen wijzigingen komen hier
// niet langs.
window.addEventListener('hashchange', () => {
  const wens = uitHash(location.hash);
  if (!bestaat(wens.id)) return;
  ga(wens.id, { stand: wens.stand || {}, uitAdres: true });
});

// --- Uitlegmodus -----------------------------------------------------------
document.getElementById('uitleg-knop').addEventListener('click', () => {
  if (!huidige || sluitUitleg || !doel.querySelector('.diagram-vak')) return;
  sluitUitleg = startUitlegmodus(doel, huidige.verhaal, huidige.naam,
    () => { sluitUitleg = null; });
});

// --- Beginstand en delen ---------------------------------------------------
document.getElementById('begin-knop').addEventListener('click', () => {
  if (!huidige) return;
  delete geheugen.standen[huidige.id];
  bewaar(geheugen);
  ga(huidige.id, { stand: {}, vers: true });
});

const deelKnop = document.getElementById('deel-knop');
const deelVeld = document.getElementById('deel-veld');
const deelAdres = document.getElementById('deel-adres');
let deelKlok = null;
function meldOpKnop(tekst) {
  deelKnop.textContent = tekst;
  clearTimeout(deelKlok);
  deelKlok = setTimeout(() => { deelKnop.textContent = 'Deel link'; }, 1800);
}
deelKnop.addEventListener('click', async () => {
  if (!huidige) return;
  clearTimeout(wacht);
  onthoud();
  const adres = location.href;
  // Eerst het deelvenster van het apparaat, dan het klembord, en als ook dat
  // niet mag de link zelf laten zien om over te nemen.
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Spacetime Forge: ' + huidige.naam, url: adres });
      return;
    } catch (fout) {
      if (fout && fout.name === 'AbortError') return;   // zelf weggetikt
    }
  }
  try {
    await navigator.clipboard.writeText(adres);
    meldOpKnop('Gekopieerd');
    return;
  } catch (fout) { /* dan met de hand */ }
  deelAdres.value = adres;
  deelVeld.hidden = false;
  deelAdres.focus();
  deelAdres.select();
});
document.getElementById('deel-dicht').addEventListener('click', () => { deelVeld.hidden = true; });

// Start: een module in het adres gaat voor, en dan telt precies wat daar
// staat. Zonder adres: de module van de vorige keer, in haar laatste stand.
const begin = uitHash(location.hash);
if (bestaat(begin.id)) ga(begin.id, { stand: begin.stand || {} });
else ga(bestaat(geheugen.module) ? geheugen.module : 'welkom');

// --- Versie ----------------------------------------------------------------
// Linksonder staat welke versie er draait. Daarnaast kijkt de app of er op het
// net al een nieuwere staat: sw.js draagt hetzelfde nummer in de naam van zijn
// cache en wordt hier vers opgehaald. Zonder net gebeurt er niets.
const versieEl = document.getElementById('versie');
versieEl.textContent = 'versie ' + VERSIE + ' · ' + DATUM;

let laatstGekeken = 0;
async function kijkNaarNieuwereVersie() {
  if (Date.now() - laatstGekeken < 60000) return;
  laatstGekeken = Date.now();
  try {
    const antwoord = await fetch('sw.js', { cache: 'no-store' });
    if (!antwoord.ok) return;
    const gevonden = /spacetime-forge-v(\d+)/.exec(await antwoord.text());
    if (!gevonden || Number(gevonden[1]) <= VERSIE) return;
    if (versieEl.querySelector('button')) return;
    const knop = document.createElement('button');
    knop.textContent = 'Versie ' + Number(gevonden[1]) + ' staat klaar — tik om te herladen';
    knop.addEventListener('click', () => {
      onthoud();
      location.reload();
    });
    versieEl.textContent = 'nu: versie ' + VERSIE;
    versieEl.appendChild(knop);
  } catch (fout) {
    // Geen verbinding: dan valt er niets te melden
  }
}
kijkNaarNieuwereVersie();
// Ook als de app na een tijd weer naar voren komt: juist dan kan er intussen
// iets nieuws staan terwijl de oude code nog in het geheugen zit.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') kijkNaarNieuwereVersie();
});

// --- Service worker (offline) -------------------------------------------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => {
      console.warn('Service worker niet geregistreerd:', e);
    });
  });
}
</script>
</body>
</html>
